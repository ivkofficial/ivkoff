<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XX.10.2026</title>
    <link rel="icon" type="image/jpeg" href="fonn.png">
    <style>
        /* Создаем правило для плавной анимации появления (от прозрачного к видимому) */
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            overflow: hidden; /* Убираем скролл */
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Применяем анимацию ко всей странице: длительность 1.5 секунды */
            animation: fadeIn 1.5s ease-in-out;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }

        .link-text {
            position: absolute;
            bottom: 40px; /* Переместили надпись вниз (отступ от нижнего края) */
            left: 50%;
            transform: translateX(-50%);
            
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 400; 
            text-align: center;
            
            /* Сменили шрифт на современный системный без засечек */
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 1.5px; /* Немного увеличили расстояние между буквами */
            text-transform: lowercase; /* Все буквы строчные, как на фото */
            
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
            z-index: 10;
            
            /* Плавное изменение при наведении мыши */
            transition: color 0.3s ease, opacity 0.3s ease;
        }

        .link-text:hover {
            color: #d1d1d1; /* При наведении текст становится слегка серым */
            text-decoration: none; /* Убрал подчеркивание, чтобы выглядело аккуратнее */
        }
    </style>
</head>
<body>

    <div class="image-container">
        <!-- Изображение -->
        <img src="fon.jpg" alt="Фоновое изображение">
        
        <!-- Ссылка теперь будет отображаться внизу -->
        <a href="body.html" class="link-text">переключиться на полную версию сайта</a>
    </div>

</body>
</html>
